name: Test
on:
  workflow_call:
  push:
    branches: ['master']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - if: runner.os != 'Windows'
        run: python3 -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        run: go build -o "$env:RUNNER_TEMP\gitso-fixture.exe" .
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/install_windows.ps1 -Fixture "$env:RUNNER_TEMP\gitso-fixture.exe"
